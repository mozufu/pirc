name: Conformance Debug

on:
  workflow_dispatch:
    inputs:
      record:
        description: Re-record snapshots (INSTA_UPDATE=always)
        type: boolean
        default: false
      scope:
        description: Cargo test target to run, or "all" for the full suite
        type: string
        default: all

permissions:
  contents: read

jobs:
  conformance:
    name: conformance (${{ inputs.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Use Ubuntu archive for browser dependencies
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -E -i 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done

      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: 153.0.8010.47
          install-dependencies: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build the executables
        run: cargo build --locked --release -p pirc-gateway -p pirc-node

      - name: Run conformance
        shell: bash
        env:
          PIRC_BROWSER_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          PIRC_BROWSER_REQUIRED: '1'
          RECORD: ${{ inputs.record }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -o pipefail
          if [ "$SCOPE" = "all" ]; then
            if [ "$RECORD" = "true" ]; then
              bun scripts/conformance.ts --record 2>&1 | tee conformance.log
            else
              bun scripts/conformance.ts 2>&1 | tee conformance.log
            fi
          else
            cargo test --locked -p pirc-conformance --test "$SCOPE" --no-fail-fast 2>&1 | tee conformance.log
          fi
        continue-on-error: true

      - name: Upload snapshots and log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: |
            conformance.log
            crates/pirc-conformance/tests/snapshots/
            target/conformance/
          if-no-files-found: warn
