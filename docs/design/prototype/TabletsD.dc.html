<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>D 平板版型總覽</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./pirc-c.css">
<link rel="stylesheet" href="./pirc-d.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 2184px; height: 2736px; box-sizing: border-box; padding: 40px; background: #EEF0F3; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px; font-family: -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif; color: #0F1115">
  <sc-for list="{{frames}}" as="f" hint-placeholder-count="6">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <div style="height: 64px; display: flex; flex-direction: column; justify-content: flex-end"><div style="font-size: 19px; line-height: 26px; font-weight: 600">{{f.title}}</div><div style="font-size: 13.5px; line-height: 19px; color: #61666B">{{f.sub}}</div></div>
      <div style="width: 1024px; height: 768px; border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 16px 48px rgba(15,17,21,.10)"><dc-import name="TabletD" layout="{{f.layout}}" dark="{{f.dark}}" hint-size="1024px,768px"></dc-import></div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2184,"height":2736}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      frames: [
        { title: '① 1024 · 統一側欄＋對話', sub: '側欄不再分聊天／工作；任務列在對話頂部', layout: 'conv', dark: false },
        { title: '② 1024 · 開啟任務詳情', sub: '沿用 C 的規則：右欄打開時收起側欄（對話 480｜任務 544）', layout: 'task', dark: false },
        { title: '③ 1024 · pots', sub: '寬螢幕分兩欄：決定與建議｜狀態、追蹤、職責', layout: 'pots', dark: false },
        { title: '④ 1024 · 深色', sub: '', layout: 'conv', dark: true },
        { title: '⑤ 1024 · 行事曆（週）', sub: '沿用現有行事曆；側欄底部進入，錯過的執行標黃', layout: 'cal', dark: false },
        { title: '⑥ 1024 · Agent 任務的執行目標失效', sub: '架構調整新增：目標被移除時暫停，要你重選後才恢復', layout: 'calAgent', dark: false }
      ]
    };
  }
}
</script>
</body>
</html>
