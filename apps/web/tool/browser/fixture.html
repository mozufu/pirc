<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>pirc content fixture</title>
    <style>
      /* A stand-in app shell: a header, a scrolling timeline, a side document and a
         dock with the controls untrusted content must never cover or restyle. */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        grid-template-rows: 48px minmax(0, 1fr) 96px;
        grid-template-columns: minmax(0, 1fr) 360px;
        grid-template-areas: 'head head' 'timeline panel' 'dock panel';
        overflow: hidden;
      }
      #app-title {
        grid-area: head;
        padding: 12px 16px;
        font-weight: 700;
        border-bottom: 1px solid #ccc;
        background: #fff;
      }
      #timeline {
        grid-area: timeline;
        overflow: auto;
        padding: 16px;
        min-height: 0;
      }
      #panel {
        min-height: 0;
        grid-area: panel;
        overflow: auto;
        padding: 12px;
        border-left: 1px solid #ccc;
        background: #fafafa;
      }
      #panel .doc {
        padding: 8px;
      }
      #dock {
        grid-area: dock;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border-top: 1px solid #ccc;
        background: #fff;
      }
      #approve {
        padding: 10px 20px;
        font-size: 15px;
        color: #fff;
        background: #1a7f37;
        border: 0;
        border-radius: 8px;
      }
      #composer {
        flex: 1;
        height: 48px;
      }
    </style>
  </head>
  <body>
    <div id="app-title">Approval required</div>
    <main id="timeline"></main>
    <aside id="panel"><div class="doc" id="doc"></div></aside>
    <div id="dock">
      <button id="approve" type="button">Approve</button>
      <textarea id="composer" aria-label="Message"></textarea>
    </div>
    <script type="module" src="/tool/browser/fixture-entry.js"></script>
  </body>
</html>
